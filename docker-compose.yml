services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopsense
      POSTGRES_USER: shopsense
      POSTGRES_PASSWORD: shopsense
    ports:
      - "5432:5432"
    volumes:
      - shopsense-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/shopsense
      DATABASE_USERNAME: shopsense
      DATABASE_PASSWORD: shopsense
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-a-long-random-value}
      FRONTEND_URL: http://localhost:5173
      PORT: 8080
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8081
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  shopsense-data: