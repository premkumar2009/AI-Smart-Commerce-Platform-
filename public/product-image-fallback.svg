<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Product image unavailable</title>
  <desc id="desc">The catalog does not currently have an image for this product.</desc>
  <rect width="900" height="900" fill="#ece8df"/>
  <rect x="120" y="120" width="660" height="660" fill="none" stroke="#a39b8d" stroke-width="8"/>
  <text x="450" y="420" text-anchor="middle" font-family="sans-serif" font-size="42" fill="#4e4a43">IMAGE UNAVAILABLE</text>
  <text x="450" y="480" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#6e675c">Catalog verification required</text>
</svg>
